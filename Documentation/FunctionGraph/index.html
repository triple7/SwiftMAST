<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Function Graph</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2b;--panel2:#172238;--line:#405170;--ink:#edf3ff;--muted:#99a9c5;--blue:#72a7ff;--green:#62e6b0;--amber:#f6c86b;--pink:#dc8cff}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
header{height:64px;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #26344e;background:#0b1220}
h1{font:650 18px/1.2 system-ui;margin:0;white-space:nowrap}.views{display:flex;gap:6px}.views button,.tool{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:8px 10px;cursor:pointer}.views button.active,.tool:hover{border-color:var(--blue);color:var(--ink);background:#17294b}
#search{min-width:180px;max-width:440px;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 11px}.stats{color:var(--muted);white-space:nowrap;margin-left:auto}
#workspace{position:relative;width:100vw;height:calc(100vh - 64px)}#chart{width:100%;height:100%;display:block;cursor:grab;background:radial-gradient(circle at 50% 40%,#111b30 0,#080d19 65%)}#chart.panning{cursor:grabbing}
.lane rect{fill:#10192a99;stroke:#2b3953;stroke-width:1;rx:14}.lane text{fill:#aebbd1;font-size:12px;font-weight:700;letter-spacing:.6px}.edge{fill:none;stroke:#50627f;stroke-width:1.6;opacity:.72;marker-end:url(#arrow)}.edge.calls{stroke:var(--blue)}.edge.dataFlow{stroke:var(--green);stroke-width:2.5}.edge.contains{stroke:var(--amber);stroke-dasharray:6 5;opacity:.35}.edge.faded{opacity:.05}
.node{cursor:pointer}.node rect{fill:var(--panel);stroke:#50617e;stroke-width:1.4;rx:10}.node.function rect{stroke:var(--blue)}.node.stage rect{stroke:var(--green);stroke-width:2}.node:hover rect,.node.selected rect{stroke:#fff;filter:drop-shadow(0 0 8px #75a7ff66)}.node.faded{opacity:.13}.node text{pointer-events:none}.node .title{fill:var(--ink);font-weight:700}.node .subtitle{fill:var(--muted);font-size:11px}.node .output{fill:var(--green);font-size:11px}.node .kind{font-size:9px;text-transform:uppercase;letter-spacing:1px}.function .kind{fill:var(--blue)}.stage .kind{fill:var(--green)}
#details{position:absolute;right:16px;top:16px;width:min(420px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto;background:#0e1728f5;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 18px 60px #0009;display:none;backdrop-filter:blur(12px)}#details.open{display:block}#details h2{font:650 18px/1.25 system-ui;margin:0 30px 8px 0;overflow-wrap:anywhere}#close{position:absolute;right:10px;top:10px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}table{width:100%;border-collapse:collapse;margin:14px 0}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid #26344e;vertical-align:top}th{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;padding:8px 10px;background:#0e1728dd;border:1px solid #26344e;border-radius:8px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.error{position:absolute;inset:24px;padding:20px;border:1px solid #a64f5a;background:#351722;color:#ffdce0;border-radius:10px;height:max-content}
@media(max-width:900px){header{height:auto;flex-wrap:wrap}.stats{margin-left:0}#workspace{height:calc(100vh - 108px)}.legend{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="title">Function Graph</h1>
  <nav class="views" aria-label="Graph view">
    <button class="active" data-view="pipeline">Processing pipeline</button>
    <button data-view="calls">Function calls</button>
    <button data-view="all">All nodes</button>
  </nav>
  <input id="search" type="search" placeholder="Find a function, argument, type, or result…">
  <button class="tool" id="fit">Fit graph</button>
  <span class="stats" id="stats">Loading JSON…</span>
</header>
<main id="workspace">
  <svg id="chart" role="img" aria-label="Connected function graph">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
    <g id="viewport"><g id="lane-layer"></g><g id="edge-layer"></g><g id="node-layer"></g></g>
  </svg>
  <aside id="details"><button id="close" aria-label="Close details">×</button><div id="detail-content"></div></aside>
  <div class="legend"><span><i class="dot" style="background:var(--green)"></i>pipeline</span><span><i class="dot" style="background:var(--blue)"></i>function</span></div>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',chart=document.getElementById('chart'),viewport=document.getElementById('viewport'),nodeLayer=document.getElementById('node-layer'),edgeLayer=document.getElementById('edge-layer'),laneLayer=document.getElementById('lane-layer');
let graph=null,view='pipeline',visibleNodes=[],visibleEdges=[],positions=new Map(),lanes=[],selected=null,box={x:0,y:0,w:1200,h:700};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shape=(s,d=0)=>{if(!s)return'Void';const h=s.name||s.kind;if(d>3)return h;if(s.kind==='object'||s.kind==='tuple')return h+' {\n'+(s.fields||[]).map(f=>'  '.repeat(d+1)+f.name+': '+shape(f.shape,d+1)).join('\n')+'\n'+'  '.repeat(d)+'}';if(s.kind==='optional')return shape(s.element,d)+'?';if(s.kind==='array')return'['+shape(s.element,d)+']';if(s.kind==='dictionary')return'['+shape(s.key,d)+': '+shape(s.element,d)+']';return h;};
function normalized(){const stages=graph.pipeline.map(x=>({...x,kind:'stage',title:x.name,subtitle:(x.input?x.input+' → ':'')+x.output,search:JSON.stringify(x).toLowerCase()}));const functions=graph.functions.map(x=>({...x,kind:'function',title:(x.ownerType?x.ownerType+'.':'')+x.name,subtitle:x.arguments.map(a=>a.label+': '+a.type).join(', '),outputLabel:shape(x.output),search:JSON.stringify(x).toLowerCase()}));return {stages,functions,all:[...stages,...functions]};}
function chooseData(){const n=normalized();if(view==='pipeline'){visibleNodes=n.stages;const ids=new Set(visibleNodes.map(x=>x.id));visibleEdges=graph.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)&&e.kind==='dataFlow');layoutPipeline(n.stages);return}if(view==='calls'){visibleEdges=graph.edges.filter(e=>e.kind==='calls');const ids=new Set(visibleEdges.flatMap(e=>[e.from,e.to]));visibleNodes=n.functions.filter(x=>ids.has(x.id));layoutGrouped(visibleNodes,true);return}visibleNodes=n.all;const ids=new Set(visibleNodes.map(x=>x.id));visibleEdges=graph.edges.filter(e=>ids.has(e.from)&&ids.has(e.to));layoutGrouped(visibleNodes,false);}
function layoutPipeline(stages){positions=new Map();lanes=[];const y=80;stages.forEach((n,i)=>positions.set(n.id,{x:60+i*285,y,w:245,h:96}));lanes.push({x:35,y:35,w:stages.length*285+5,h:186,title:'MAST request lifecycle · execution order'});}
function ownerOrder(nodes){const ownerKey=n=>n.kind==='function'?(n.ownerType||'Global'):'Request lifecycle',owners=[...new Set(nodes.map(ownerKey))].sort();if(view!=='calls')return owners;const byID=new Map(nodes.map(n=>[n.id,ownerKey(n)])),out=new Map(owners.map(x=>[x,new Set()])),degree=new Map(owners.map(x=>[x,0]));visibleEdges.forEach(e=>{const a=byID.get(e.from),b=byID.get(e.to);if(a&&b&&a!==b&&!out.get(a).has(b)){out.get(a).add(b);degree.set(b,degree.get(b)+1)}});const queue=owners.filter(x=>degree.get(x)===0).sort(),ordered=[];while(queue.length){const x=queue.shift();ordered.push(x);[...out.get(x)].sort().forEach(y=>{degree.set(y,degree.get(y)-1);if(degree.get(y)===0){queue.push(y);queue.sort()}})}return [...ordered,...owners.filter(x=>!ordered.includes(x))];}
function layoutGrouped(nodes,callsOnly){positions=new Map();lanes=[];const key=n=>n.kind==='function'?(n.ownerType||'Global'):'Request lifecycle',groups=new Map();nodes.forEach(n=>{const k=key(n);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(n)});let x=45;ownerOrder(nodes).filter(k=>groups.has(k)).forEach(name=>{const items=groups.get(name).sort((a,b)=>a.title.localeCompare(b.title)),cols=Math.max(1,Math.ceil(items.length/14)),rows=Math.min(14,items.length),w=30+cols*270,h=55+rows*104;lanes.push({x,y:45,w,h,title:`${name} · ${items.length}`});items.forEach((n,i)=>positions.set(n.id,{x:x+15+Math.floor(i/14)*270,y:85+(i%14)*104,w:250,h:88}));x+=w+35});}
function svg(tag,attrs={}){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
function short(s,n=38){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function edgePath(a,b){const ac={x:a.x+a.w/2,y:a.y+a.h/2},bc={x:b.x+b.w/2,y:b.y+b.h/2},dx=bc.x-ac.x,dy=bc.y-ac.y;if(Math.abs(dx)>=Math.abs(dy)){const forward=dx>=0,x1=forward?a.x+a.w:a.x,x2=forward?b.x:b.x+b.w,y1=ac.y,y2=bc.y,c=Math.max(45,Math.abs(x2-x1)*.45);return`M${x1},${y1} C${x1+(forward?c:-c)},${y1} ${x2-(forward?c:-c)},${y2} ${x2},${y2}`}const down=dy>=0,x1=ac.x,x2=bc.x,y1=down?a.y+a.h:a.y,y2=down?b.y:b.y+b.h,c=Math.max(35,Math.abs(y2-y1)*.4);return`M${x1},${y1} C${x1},${y1+(down?c:-c)} ${x2},${y2-(down?c:-c)} ${x2},${y2}`}
function draw(){nodeLayer.replaceChildren();edgeLayer.replaceChildren();laneLayer.replaceChildren();lanes.forEach(l=>{const g=svg('g',{class:'lane'});g.append(svg('rect',{x:l.x,y:l.y,width:l.w,height:l.h}));const t=svg('text',{x:l.x+15,y:l.y+24});t.textContent=l.title;g.append(t);laneLayer.append(g)});const q=document.getElementById('search').value.trim().toLowerCase(),matches=new Set(!q?visibleNodes.map(n=>n.id):visibleNodes.filter(n=>n.search.includes(q)).map(n=>n.id));visibleEdges.forEach(e=>{const a=positions.get(e.from),b=positions.get(e.to);if(!a||!b)return;const path=svg('path',{d:edgePath(a,b),class:`edge ${e.kind}${q&&(!matches.has(e.from)||!matches.has(e.to))?' faded':''}`});edgeLayer.append(path)});visibleNodes.forEach(n=>{const p=positions.get(n.id),g=svg('g',{class:`node ${n.kind}${q&&!matches.has(n.id)?' faded':''}${selected===n.id?' selected':''}`,transform:`translate(${p.x} ${p.y})`,'data-id':n.id,tabindex:'0',role:'button'});const tooltip=svg('title');tooltip.textContent=`${n.title}\n${n.subtitle||n.description||''}${n.outputLabel?'\n→ '+n.outputLabel:''}`;g.append(tooltip);g.append(svg('rect',{width:p.w,height:p.h}));const kind=svg('text',{x:14,y:17,class:'kind'});kind.textContent=n.kind;g.append(kind);const title=svg('text',{x:14,y:38,class:'title'});title.textContent=short(n.title,30);g.append(title);const sub=svg('text',{x:14,y:58,class:'subtitle'});sub.textContent=short(n.subtitle||n.description,34);g.append(sub);if(n.outputLabel){const out=svg('text',{x:14,y:78,class:'output'});out.textContent='→ '+short(n.outputLabel,32);g.append(out)}g.addEventListener('click',()=>showDetails(n));g.addEventListener('keydown',e=>{if(e.key==='Enter')showDetails(n)});nodeLayer.append(g)});fitGraph();document.getElementById('stats').textContent=`${visibleNodes.length} nodes · ${visibleEdges.length} connections`;}
function fitGraph(){if(!positions.size)return;const ps=[...positions.values(),...lanes],minX=Math.min(...ps.map(p=>p.x))-35,minY=Math.min(...ps.map(p=>p.y))-35,maxX=Math.max(...ps.map(p=>p.x+p.w))+35,maxY=Math.max(...ps.map(p=>p.y+p.h))+35;box={x:minX,y:minY,w:maxX-minX,h:maxY-minY};applyBox()}
function applyBox(){chart.setAttribute('viewBox',`${box.x} ${box.y} ${box.w} ${box.h}`)}
function showDetails(n){selected=n.id;document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===n.id));let rows='';if(n.kind==='function')rows=n.arguments.map(a=>`<tr><td>${esc(a.label)}</td><td>${esc(a.type)}</td><td>${esc(a.defaultValue??(a.required?'required':'—'))}</td></tr>`).join('');const incoming=graph.edges.filter(e=>e.to===n.id).length,outgoing=graph.edges.filter(e=>e.from===n.id).length;document.getElementById('detail-content').innerHTML=`<div style="color:var(--muted)">${esc(n.kind)}</div><h2>${esc(n.title)}</h2>${n.documentation?'<pre>'+esc(n.documentation)+'</pre>':''}${rows?'<table><thead><tr><th>Argument</th><th>Type</th><th>Default</th></tr></thead><tbody>'+rows+'</tbody></table>':''}<h3>Output structure</h3><pre>${esc(n.outputLabel||n.output||'—')}</pre><p>${incoming} incoming · ${outgoing} outgoing connections</p>${n.source?'<p>'+esc(n.source.file)+':'+n.source.line+'</p>':''}`;document.getElementById('details').classList.add('open')}
function render(){chooseData();draw()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;selected=null;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('details').classList.remove('open');render()}));document.getElementById('search').addEventListener('input',draw);document.getElementById('fit').addEventListener('click',fitGraph);document.getElementById('close').addEventListener('click',()=>{selected=null;document.getElementById('details').classList.remove('open');draw()});
chart.addEventListener('wheel',e=>{e.preventDefault();const scale=e.deltaY>0?1.12:.89,mx=e.offsetX/chart.clientWidth,my=e.offsetY/chart.clientHeight,nw=box.w*scale,nh=box.h*scale;box.x+=box.w*mx-nw*mx;box.y+=box.h*my-nh*my;box.w=nw;box.h=nh;applyBox()},{passive:false});let drag=null;chart.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,box:{...box}};chart.setPointerCapture(e.pointerId);chart.classList.add('panning')});chart.addEventListener('pointermove',e=>{if(!drag)return;box.x=drag.box.x-(e.clientX-drag.x)*drag.box.w/chart.clientWidth;box.y=drag.box.y-(e.clientY-drag.y)*drag.box.h/chart.clientHeight;applyBox()});chart.addEventListener('pointerup',()=>{drag=null;chart.classList.remove('panning')});
fetch('./function-graph.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{graph=data;document.title=graph.module+' Function Graph';document.getElementById('title').textContent=graph.module+' Function Graph';render()}).catch(error=>{document.getElementById('workspace').insertAdjacentHTML('beforeend','<div class="error"><strong>Could not load function-graph.json.</strong><br>Serve this directory over HTTP, for example:<pre>python3 -m http.server 8080 --directory Documentation/FunctionGraph</pre>'+esc(error.message)+'</div>');document.getElementById('stats').textContent='JSON unavailable'});
</script>
</body>
</html>
